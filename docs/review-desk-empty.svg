<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><rect width="1280" height="800" fill="#101827"/><style>text{font-family:Arial,sans-serif} .card{fill:#172338;stroke:#293b58} .muted{fill:#91a0b7} .white{fill:#e8edf5}</style><text x="32" y="72" font-size="34" font-weight="700" class="white">Reply Review Desk</text><text x="32" y="108" font-size="17" class="muted">Drafts pause for human approval and survive restarts.</text><rect x="32" y="150" width="380" height="570" rx="14" class="card"/><rect x="442" y="150" width="806" height="570" rx="14" class="card"/><text x="60" y="210" font-size="25" font-weight="700" class="white">New draft</text><rect x="60" y="246" width="324" height="48" rx="9" fill="#0e1726" stroke="#3a4d6b"/><text x="76" y="276" font-size="16" class="muted">Ticket ID (optional)</text><rect x="60" y="310" width="324" height="150" rx="9" fill="#0e1726" stroke="#3a4d6b"/><text x="76" y="340" font-size="16" class="muted">Proposed support reply</text><rect x="60" y="482" width="324" height="48" rx="9" fill="#4f8cff"/><text x="145" y="512" font-size="16" fill="white" font-weight="700">Send for review</text><text x="60" y="592" font-size="25" font-weight="700" class="white">Queue</text><text x="474" y="210" font-size="25" font-weight="700" class="white">Select a review</text><text x="474" y="252" font-size="17" class="muted">Choose a pending draft from the queue.</text></svg>
