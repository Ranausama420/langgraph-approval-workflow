<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><rect width="1280" height="800" fill="#101827"/><style>text{font-family:Arial,sans-serif} .card{fill:#172338;stroke:#293b58} .muted{fill:#91a0b7} .white{fill:#e8edf5}</style><text x="32" y="72" font-size="34" font-weight="700" class="white">Reply Review Desk</text><text x="32" y="108" font-size="17" class="muted">Drafts pause for human approval and survive restarts.</text><rect x="32" y="150" width="380" height="570" rx="14" class="card"/><rect x="442" y="150" width="806" height="570" rx="14" class="card"/><text x="60" y="210" font-size="25" font-weight="700" class="white">Queue</text><text x="60" y="260" font-size="13" fill="#9ac1ff">PENDING</text><text x="60" y="288" font-size="18" class="white">SUP-100</text><text x="474" y="210" font-size="13" fill="#9ac1ff">PENDING</text><text x="474" y="250" font-size="25" font-weight="700" class="white">SUP-100</text><text x="474" y="292" font-size="15" class="muted">Original draft</text><text x="474" y="326" font-size="17" class="white">Restart the desktop client and retry the login.</text><rect x="474" y="380" width="746" height="150" rx="9" fill="#0e1726" stroke="#3a4d6b"/><text x="490" y="412" font-size="16" class="white">Restart the desktop client and retry the login.</text><rect x="474" y="560" width="235" height="48" rx="9" fill="#4f8cff"/><text x="552" y="590" font-size="16" fill="white" font-weight="700">Approve</text><rect x="725" y="560" width="235" height="48" rx="9" fill="#31435e"/><text x="785" y="590" font-size="16" fill="white" font-weight="700">Save edit</text><rect x="976" y="560" width="244" height="48" rx="9" fill="#a84958"/><text x="1060" y="590" font-size="16" fill="white" font-weight="700">Reject</text></svg>
