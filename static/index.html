<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reply Review Desk</title>
<style>:root{font-family:system-ui,sans-serif;color:#e8edf5;background:#101827}body{max-width:1100px;margin:auto;padding:40px 24px}.muted{color:#91a0b7}.grid{display:grid;grid-template-columns:320px 1fr;gap:24px;margin-top:28px}.card{background:#172338;border:1px solid #293b58;border-radius:14px;padding:20px}input,textarea,button{width:100%;box-sizing:border-box;border-radius:9px;padding:11px;margin-top:8px;font:inherit}input,textarea{background:#0e1726;color:#fff;border:1px solid #3a4d6b}textarea{min-height:140px;resize:vertical}button{border:0;background:#4f8cff;color:white;cursor:pointer;font-weight:600}button.secondary{background:#31435e}button.danger{background:#a84958}.row{display:flex;gap:8px}.row button{flex:1}.item{padding:12px;border-bottom:1px solid #293b58;cursor:pointer}.item:hover{background:#20304a}.badge{color:#9ac1ff;font-size:12px;text-transform:uppercase}.hidden{display:none}</style></head>
<body><h1>Reply Review Desk</h1><p class="muted">Drafts pause for human approval and survive restarts.</p><div class="grid"><section class="card"><h2>New draft</h2><input id="ticket" placeholder="Ticket ID (optional)"><textarea id="draft" placeholder="Proposed support reply"></textarea><button onclick="createReview()">Send for review</button><p id="message" class="muted"></p><h2>Queue</h2><div id="queue"></div></section><section class="card"><div id="empty"><h2>Select a review</h2><p class="muted">Choose a pending draft from the queue.</p></div><div id="detail" class="hidden"><span id="status" class="badge"></span><h2 id="title"></h2><p class="muted">Original draft</p><pre id="original" style="white-space:pre-wrap"></pre><textarea id="edited"></textarea><div class="row"><button onclick="decide('approve')">Approve</button><button class="secondary" onclick="decide('edit')">Save edit</button><button class="danger" onclick="decide('reject')">Reject</button></div><p id="result" class="muted"></p></div></section></div>
<script>let current=null;async function api(path,options){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...options});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}async function load(){const d=await api('/reviews');queue.innerHTML=d.items.length?d.items.map(x=>'<div class="item" onclick="openReview(\\''+x.id+'\\')"><span class="badge">'+x.status+'</span><br>'+(x.ticket_id||x.id.slice(0,10))+'</div>').join(''):'<p class="muted">No reviews yet.</p>'}async function createReview(){try{const d=await api('/reviews',{method:'POST',body:JSON.stringify({draft:draft.value,ticket_id:ticket.value||null})});message.textContent='Created '+d.id;draft.value='';ticket.value='';await load();openReview(d.id)}catch(e){message.textContent=e.message}}async function openReview(id){current=id;const d=await api('/reviews/'+id);empty.classList.add('hidden');detail.classList.remove('hidden');status.textContent=d.status;title.textContent=d.ticket_id||id;original.textContent=d.draft;edited.value=d.draft;result.textContent=d.status==='pending'?'Waiting for your decision':'Decision: '+d.decision;document.querySelectorAll('#detail button').forEach(b=>b.disabled=d.status!=='pending')}async function decide(kind){try{const body={decision:kind};if(kind==='edit')body.text=edited.value;const d=await api('/reviews/'+current+'/decision',{method:'POST',body:JSON.stringify(body)});result.textContent='Saved: '+d.decision;await load();openReview(current)}catch(e){result.textContent=e.message}}load();</script></body></html>
